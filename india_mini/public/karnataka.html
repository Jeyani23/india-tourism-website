<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Karnataka - One State, Many Worlds</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        /* HERO SECTION */
        .hero {
            height: 350px;
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url("https://upload.wikimedia.org/wikipedia/commons/a/a4/Mysore_Palace_Morning.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-shadow: 2px 2px 6px black;
        }

        .hero h1 { font-size: 50px; margin: 0; }
        .hero p { font-size: 20px; }

        /* INFO CARDS */
        .infoCards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: -40px;
        }

        .infoCard {
            background: white;
            padding: 20px;
            width: 180px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .sectionTitle {
            text-align: center;
            margin-top: 50px;
            color: #FF9933;
        }

        /* PLACES GRID */
        .places {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 40px;
        }

        .placeCard {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 10px;
        }

        .placeCard img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: 0.4s;
        }

        .placeCard:hover img { transform: scale(1.1); }

        .overlay {
            position: absolute;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            color: white;
            width: 100%;
            text-align: center;
            padding: 10px;
        }

        /* MODAL (Hidden by default) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none; /* Changed from React state to CSS display */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modalContent {
            background: white;
            padding: 30px;
            width: 500px;
            border-radius: 8px;
            text-align: center;
            position: relative;
        }

        .modalContent img { width: 100%; height: 250px; object-fit: cover; }

        .close {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #333;
        }

        /* CUISINE */
        .cuisine {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 40px;
        }

        .foodCard {
            background: white;
            text-align: center;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        .foodCard img { width: 100%; height: 150px; object-fit: cover; }

        /* LITERATURE */
        .literature {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 40px;
        }

        .litCard {
            background: white;
            padding: 15px;
            border-left: 5px solid #138808;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        .litCard img { width: 100%; height: 180px; object-fit: cover; }

        .tamilLine {
            color: #138808;
            font-weight: bold;
            margin-top: 10px;
            white-space: pre-line; /* Keeps the line breaks in Tamil text */
        }

        .hero{
height:350px;
background-image:linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)),
url("https://upload.wikimedia.org/wikipedia/commons/a/a4/Mysore_Palace_Morning.jpg");
background-size:cover;
background-position:center;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
text-shadow:2px 2px 6px black;
}

        /* Responsive adjustments */
        @media (max-width: 900px) {
            .places, .literature { grid-template-columns: repeat(2, 1fr); }
            .cuisine { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Explore Karnataka</h1>
        <p>Land of Heritage, Technology and Nature</p>
    </div>

    <div class="infoCards">
        <div class="infoCard"><h3>Capital</h3><p>Bengaluru</p></div>
        <div class="infoCard"><h3>Language</h3><p>Kannada</p></div>
        <div class="infoCard"><h3>Best Time</h3><p>October – March</p></div>
        <div class="infoCard"><h3>Major Cities</h3><p>Bengaluru, Mysuru, Mangaluru</p></div>
    </div>

    <h2 class="sectionTitle">Famous Tourist Places</h2>
    <div class="places" id="placesGrid"></div>

    <div class="modal" id="placeModal">
        <div class="modalContent">
            <span class="close" onclick="closeModal()">&times;</span>
            <img src="" id="modalImg" alt="">
            <h2 id="modalTitle"></h2>
            <p id="modalDesc" style="line-height: 1.6;"></p>
        </div>
    </div>

    <h2 class="sectionTitle">Karnataka Cuisine</h2>
    <div class="cuisine" id="cuisineGrid"></div>

    <h2 class="sectionTitle">Kannada Literature</h2>
    <div class="literature" id="litGrid"></div>

    <script>
        const places = [
            { name: "Mysore Palace", img: "https://upload.wikimedia.org/wikipedia/commons/a/a4/Mysore_Palace_Morning.jpg", desc: "Mysore Palace is one of the most magnificent royal palaces in India. Famous for its Indo-Saracenic architecture, it was the residence of the Wodeyar dynasty." },
            { name: "Hampi", img: "https://s7ap1.scene7.com/is/image/incredibleindia/a-journey-through-masthead-hero-1?qlt=82&ts=1727368343764", desc: "A UNESCO World Heritage Site and the former capital of the Vijayanagara Empire, known for its ancient temples and stone chariots." },
            { name: "Coorg", img: "https://static.toiimg.com/thumb/104040262/coorg.jpg?width=1200&height=900", desc: "Also called Kodagu, known for coffee plantations, waterfalls and green hills. A paradise for nature lovers." },
            { name: "Jog Falls", img: "https://hblimg.mmtcdn.com/content/hubble/img/waterfallstiod/mmt/activities/m_Waterfalls_Jog_Waterfalls_Karnataka_p_640_640.jpg", desc: "One of the highest waterfalls in India, formed by the Sharavathi River in the Shimoga district." },
            { name: "Badami Cave Temples", img: "https://turuhi.com/storage/story/1-Badami-Caves.jpg", desc: "Ancient rock-cut temples built by the Chalukya dynasty in the 6th century, featuring exquisite Hindu and Jain sculptures." },
            { name: "Bangalore City", img: "https://karnatakatourism.org/_next/image/?url=https%3A%2F%2Fweb-cms.karnatakatourism.org%2Fwp-content%2Fuploads%2F2025%2F06%2FUB_City_at_night_.jpg&w=3840&q=75", desc: "The 'Silicon Valley of India', known for technology, its pleasant climate, and vibrant modern culture." }
        ];

        const cuisines = [
            { name: "Bisi Bele Bath", img: "https://i0.wp.com/smithakalluraya.com/wp-content/uploads/2015/08/fb.jpg?resize=720%2C882&ssl=1" },
            { name: "Mysore Pak", img: "https://www.shreemithai.com/cdn/shop/products/spl-mysore-pak-206182.jpg?v=1707820107" },
            { name: "Ragi Mudde", img: "https://www.indianhealthyrecipes.com/wp-content/uploads/2021/02/ragi-mudde-recipe.jpg" },
            { name: "Mangalore Fish Curry", img: "https://www.licious.in/blog/wp-content/uploads/2021/01/Mangalorean-Pomfret-Fish-Curry.jpg" }
        ];

        const literature = [
            { name: "Vachana Sahitya", img: "https://static.wixstatic.com/media/c6a914_8eb49417e9fc434ca7f3aaa4e87e2228~mv2.jpg/v1/fill/w_480,h_716,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/c6a914_8eb49417e9fc434ca7f3aaa4e87e2228~mv2.jpg", info: "Written by Basavanna and other saints, expressing devotion and social reform.", line: "ಕಾಯಕವೇ ಕೈಲಾಸ" },
            { name: "Ramayana Darshanam", img: "https://m.media-amazon.com/images/I/A10AaIBuruL.jpg", info: "One of the greatest works in modern Kannada literature, written by the poet Kuvempu.", line: "ಮಾನವನೇ ದೇವರು" },
            { name: "Pampa Bharata", img: "https://m.media-amazon.com/images/I/91qjgn0Ly4L._AC_UF1000,1000_QL80_.jpg", info: "A famous Kannada epic written by Adikavi Pampa based on the Mahabharata.", line: "ಧರ್ಮವೇ ಜಯ" }
        ];

        // Load Places
        const placesGrid = document.getElementById('placesGrid');
        places.forEach(p => {
            const div = document.createElement('div');
            div.className = 'placeCard';
            div.onclick = () => openModal(p);
            div.innerHTML = `<img src="${p.img}"><div class="overlay"><h3>${p.name}</h3></div>`;
            placesGrid.appendChild(div);
        });

        // Load Cuisine
        const cuisineGrid = document.getElementById('cuisineGrid');
        cuisines.forEach(c => {
            const div = document.createElement('div');
            div.className = 'foodCard';
            div.innerHTML = `<img src="${c.img}"><p>${c.name}</p>`;
            cuisineGrid.appendChild(div);
        });

        // Load Literature
        const litGrid = document.getElementById('litGrid');
        literature.forEach(l => {
            const div = document.createElement('div');
            div.className = 'litCard';
            div.innerHTML = `<img src="${l.img}"><h3>${l.name}</h3><p>${l.info}</p><p class="kannadaLine">${l.line}</p>`;
            litGrid.appendChild(div);
        });

        // Modal Logic
        function openModal(place) {
            document.getElementById('modalImg').src = place.img;
            document.getElementById('modalTitle').innerText = place.name;
            document.getElementById('modalDesc').innerText = place.desc;
            document.getElementById('placeModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('placeModal').style.display = 'none';
        }

        window.onclick = (e) => { if(e.target.id === 'placeModal') closeModal(); }
    </script>
</body>
</html>
