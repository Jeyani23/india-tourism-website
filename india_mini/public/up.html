<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Explore Uttar Pradesh</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

.hero{
height:350px;
background-image:linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)),
url("https://upload.wikimedia.org/wikipedia/commons/d/da/Taj-Mahal.jpg");
background-size:cover;
background-position:center;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
text-shadow:2px 2px 6px black;
}

.hero h1{font-size:50px}

/* INFO CARDS */

.infoCards{
display:flex;
justify-content:center;
gap:20px;
margin-top:-40px;
}

.infoCard{
background:white;
padding:20px;
width:180px;
text-align:center;
border-radius:8px;
box-shadow:0 4px 8px rgba(0,0,0,0.2);
}

/* SECTION TITLE */

.sectionTitle{
text-align:center;
margin-top:50px;
color:#FF9933;
}

/* PLACES GRID */

.places{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
padding:40px;
}

.placeCard{
position:relative;
cursor:pointer;
overflow:hidden;
border-radius:10px;
transition:transform 0.3s,box-shadow 0.3s;
}

.placeCard:hover{
transform:translateY(-10px);
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

.placeCard img{
width:100%;
height:220px;
object-fit:cover;
transition:transform 0.5s;
}

.placeCard:hover img{
transform:scale(1.1);
}

.overlay{
position:absolute;
bottom:0;
background:rgba(0,0,0,0.6);
color:white;
width:100%;
text-align:center;
padding:10px;
}

/* FADE ANIMATION */

.fadeIn{
opacity:0;
animation:fade 1.2s forwards;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* MODAL */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
}

.modalContent{
background:white;
padding:30px;
width:500px;
border-radius:8px;
transform:scale(0.8);
animation:pop 0.4s forwards;
}

@keyframes pop{
from{transform:scale(0.8);opacity:0;}
to{transform:scale(1);opacity:1;}
}

.modalContent img{
width:100%;
height:250px;
object-fit:cover;
}

.close{
float:right;
font-size:30px;
cursor:pointer;
}

/* CUISINE */

.cuisine{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
padding:40px;
}

.foodCard{
background:white;
text-align:center;
padding:10px;
box-shadow:0 3px 6px rgba(0,0,0,0.2);
}

.foodCard img{
width:100%;
height:150px;
object-fit:cover;
}

</style>
</head>

<body>

<div class="hero">
<h1>Explore Uttar Pradesh</h1>
<p>Land of Spiritual and Mughal Heritage</p>
</div>

<div class="infoCards">
<div class="infoCard"><h3>Capital</h3><p>Lucknow</p></div>
<div class="infoCard"><h3>Language</h3><p>Hindi</p></div>
<div class="infoCard"><h3>Best Time</h3><p>Oct – March</p></div>
<div class="infoCard"><h3>Cities</h3><p>Agra, Varanasi</p></div>
</div>

<h2 class="sectionTitle">Famous Tourist Places</h2>

<div class="places fadeIn">

<div class="placeCard" onclick="openModal('Taj Mahal','The Taj Mahal in Agra is one of the Seven Wonders of the World built by Mughal emperor Shah Jahan in memory of his wife Mumtaz Mahal.','https://upload.wikimedia.org/wikipedia/commons/d/da/Taj-Mahal.jpg')">
<img src="https://upload.wikimedia.org/wikipedia/commons/d/da/Taj-Mahal.jpg">
<div class="overlay"><h3>Taj Mahal</h3></div>
</div>

<div class="placeCard" onclick="openModal('Varanasi Ghats','Varanasi is one of the oldest living cities in the world. The ghats along the Ganges river are famous for spiritual rituals and evening Ganga Aarti.','https://upload.wikimedia.org/wikipedia/commons/0/04/Ahilya_Ghat_by_the_Ganges%2C_Varanasi.jpg')">
<img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Ahilya_Ghat_by_the_Ganges%2C_Varanasi.jpg">
<div class="overlay"><h3>Varanasi</h3></div>
</div>

<div class="placeCard" onclick="openModal('Fatehpur Sikri','Fatehpur Sikri was the capital of the Mughal Empire during Akbar’s reign and is known for its grand red sandstone architecture.','https://static.wixstatic.com/media/055605_5c2549f84a254d18b7eddf99afe12ff2~mv2.png/v1/fill/w_572,h_324,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/fdc7ba38-f616-41e4-a536-c85db0cc6bcc15.png')">
<img src="https://static.wixstatic.com/media/055605_5c2549f84a254d18b7eddf99afe12ff2~mv2.png/v1/fill/w_572,h_324,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/fdc7ba38-f616-41e4-a536-c85db0cc6bcc15.png">
<div class="overlay"><h3>Fatehpur Sikri</h3></div>
</div>

<div class="placeCard" onclick="openModal('Ayodhya','Ayodhya is believed to be the birthplace of Lord Rama and is one of the most sacred cities in Hinduism.','https://www.triptotemples.com/_next/image?url=https%3A%2F%2Fcdn.triptotemples.com%2Fblogs%2Fbanner-image-68a94ec63548690bc4c576af-79584280.webp&w=1920&q=75')">
<img src="https://www.triptotemples.com/_next/image?url=https%3A%2F%2Fcdn.triptotemples.com%2Fblogs%2Fbanner-image-68a94ec63548690bc4c576af-79584280.webp&w=1920&q=75">
<div class="overlay"><h3>Ayodhya</h3></div>
</div>

<div class="placeCard" onclick="openModal('Mathura','Mathura is the birthplace of Lord Krishna and an important pilgrimage destination.','https://www.oyorooms.com/travel-guide/wp-content/uploads/2019/05/Mathura-Vrindavan-Spiritual-haven-for-devotees-Prem-Mandir-Image-3.webp')">
<img src="https://www.oyorooms.com/travel-guide/wp-content/uploads/2019/05/Mathura-Vrindavan-Spiritual-haven-for-devotees-Prem-Mandir-Image-3.webp">
<div class="overlay"><h3>Mathura</h3></div>
</div>

<div class="placeCard" onclick="openModal('Lucknow Bara Imambara','Bara Imambara is a historic monument famous for its massive hall and Bhool Bhulaiya maze.','https://static.toiimg.com/photo/103890972.cms')">
<img src="https://static.toiimg.com/photo/103890972.cms">
<div class="overlay"><h3>Bara Imambara</h3></div>
</div>

</div>

<h2 class="sectionTitle">Famous Cuisine</h2>

<div class="cuisine">

<div class="foodCard">
<img src="https://images.herzindagi.info/image/2019/May/tunday-kabab.jpg">
<p>Tunday Kabab</p>
</div>

<div class="foodCard">
<img src="https://3.imimg.com/data3/KP/DV/MY-7322329/dry-petha-500x500.gif">
<p>Agra Petha</p>
</div>

<div class="foodCard">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSyrZIg1Nk-gIO1GhR53lmZ7nE5WEXNQK7h0A&s">
<p>Bedai</p>
</div>

<div class="foodCard">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTtSm2ouMProbO5W-xYWMscAvyr-ade6FZDCg&s">
<p>Sheermal</p>
</div>

</div>

<div class="modal" id="modal">
<div class="modalContent">
<span class="close" onclick="closeModal()">&times;</span>
<img id="modalImg">
<h2 id="modalTitle"></h2>
<p id="modalDesc"></p>
</div>
</div>

<script>

function openModal(title,desc,img){
document.getElementById("modal").style.display="flex"
document.getElementById("modalTitle").innerText=title
document.getElementById("modalDesc").innerText=desc
document.getElementById("modalImg").src=img
}

function closeModal(){
document.getElementById("modal").style.display="none"
}

</script>

</body>
</html>
