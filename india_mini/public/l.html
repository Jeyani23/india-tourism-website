<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Explore Ladakh</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;}

.hero{
height:350px;
background:linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)),
url("https://upload.wikimedia.org/wikipedia/commons/4/4b/Pangong_Lake.jpg") center/cover;
display:flex;justify-content:center;align-items:center;color:white;
text-shadow:2px 2px 6px black;
}

.infoCards{display:flex;justify-content:center;gap:20px;margin-top:-40px;}
.infoCard{background:white;padding:20px;width:180px;text-align:center;border-radius:8px;}

.sectionTitle{text-align:center;margin-top:50px;color:#FF9933;}

.places{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;padding:40px;}

.placeCard{cursor:pointer;overflow:hidden;border-radius:10px;transition:0.3s;}
.placeCard:hover{transform:translateY(-10px);}
.placeCard img{width:100%;height:220px;object-fit:cover;transition:0.5s;}
.placeCard:hover img{transform:scale(1.1);}

.overlay{position:absolute;background:rgba(0,0,0,0.6);color:white;width:100%;bottom:0;text-align:center;}

.modal{position:fixed;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;}
.modalContent{background:white;padding:20px;width:500px;}

</style>
</head>

<body>

<div class="hero"><h1>Explore Ladakh</h1></div>

<div class="infoCards">
<div class="infoCard"><h3>Capital</h3><p>Leh</p></div>
<div class="infoCard"><h3>Language</h3><p>Ladakhi</p></div>
<div class="infoCard"><h3>Best Time</h3><p>May – Sept</p></div>
<div class="infoCard"><h3>Known For</h3><p>Mountains</p></div>
</div>

<h2 class="sectionTitle">Famous Places</h2>

<div class="places">
<div class="placeCard" onclick="openModal('Pangong Lake','A beautiful high-altitude lake changing colors.','https://upload.wikimedia.org/wikipedia/commons/4/4b/Pangong_Lake.jpg')">
<img src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Pangong_Lake.jpg">
<div class="overlay">Pangong Lake</div>
</div>

<div class="placeCard" onclick="openModal('Leh Palace','Historic palace overlooking Leh city.','https://upload.wikimedia.org/wikipedia/commons/3/3c/Leh_Palace.jpg')">
<img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Leh_Palace.jpg">
<div class="overlay">Leh Palace</div>
</div>

<div class="placeCard" onclick="openModal('Nubra Valley','Famous for sand dunes and camels.','https://upload.wikimedia.org/wikipedia/commons/1/12/Nubra_Valley.jpg')">
<img src="https://upload.wikimedia.org/wikipedia/commons/1/12/Nubra_Valley.jpg">
<div class="overlay">Nubra Valley</div>
</div>
</div>

<div class="modal" id="modal">
<div class="modalContent">
<span onclick="closeModal()">X</span>
<img id="modalImg" width="100%">
<h2 id="modalTitle"></h2>
<p id="modalDesc"></p>
</div>
</div>

<script>
function openModal(t,d,i){
modal.style.display="flex";
modalTitle.innerText=t;
modalDesc.innerText=d;
modalImg.src=i;
}
function closeModal(){modal.style.display="none";}
</script>

</body>
</html>
